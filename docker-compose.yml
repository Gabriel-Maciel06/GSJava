services:
  db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: agroid_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./db/db_setup.sql:/container-entrypoint-initdb.d/01_db_setup.sql
      - ./db/db_procedures.sql:/container-entrypoint-initdb.d/02_db_procedures.sql
    networks:
      - agroid_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agroid_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - SPRING_DATASOURCE_USERNAME=${APP_USER}
      - SPRING_DATASOURCE_PASSWORD=${APP_USER_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - agroid_network
    restart: unless-stopped

volumes:
  oracle_data:
    name: oracle_data_volume_gsjava

networks:
  agroid_network:
    driver: bridge
